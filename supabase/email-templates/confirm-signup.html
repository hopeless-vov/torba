<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#f4f6f7;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="440" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;border-radius:14px;padding:36px;border:1px solid #e4e7ea;">
        <tr>
          <td style="padding-bottom:24px;">
            <table cellpadding="0" cellspacing="0" role="presentation">
              <tr>
                <td style="width:40px;height:40px;background:#17935e;border-radius:10px;text-align:center;vertical-align:middle;font-size:20px;line-height:40px;">🛍️</td>
                <td style="padding-left:12px;font-size:18px;font-weight:700;color:#16191c;">torba</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="font-size:22px;font-weight:700;color:#16191c;padding-bottom:10px;">Підтвердіть реєстрацію</td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:22px;color:#5b6570;padding-bottom:28px;">
            Дякуємо за реєстрацію. Натисніть кнопку нижче, щоб підтвердити адресу
            <strong>{{ .Email }}</strong> та увійти у свій робочий простір.
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#17935e;color:#ffffff;font-size:14px;font-weight:500;text-decoration:none;padding:13px 20px;border-radius:8px;">Підтвердити пошту</a>
          </td>
        </tr>
        <tr>
          <td style="font-size:12px;line-height:20px;color:#8b95a1;">
            Якщо ви не реєструвалися в torba, просто проігноруйте цей лист.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
